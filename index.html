<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>مشاهدة الفيديو</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;min-height:100%;background:#000;font-family:Arial,sans-serif;color:#fff}
body{min-height:100vh;display:flex;justify-content:center;align-items:center}
.page{width:100%;max-width:1100px;padding:16px}
.title{text-align:center;font-size:clamp(20px,4vw,30px);margin:0 0 14px}
.player{width:100%;aspect-ratio:9/16;background:#000;overflow:hidden;border-radius:12px;position:relative}
.player iframe{display:block;width:100%;height:100%;border:0}
.hint{text-align:center;color:#aaa;font-size:13px;margin-top:12px}
@media(max-width:600px){body{align-items:flex-start}.page{padding:8px;padding-top:18px}.player{border-radius:8px}}
</style>
</head>
<body>
<main class="page">
<h1 class="title">مشاهدة الفيديو</h1>
<div class="player">
<iframe src="https://drive.google.com/file/d/1TjqWQSWNoi9j3MZRS0mYR2B2E-utIsWt/preview"
title="مشغل الفيديو"
allow="autoplay; fullscreen; picture-in-picture"
allowfullscreen webkitallowfullscreen mozallowfullscreen></iframe>
</div>
<div class="hint">استخدم زر ملء الشاشة داخل مشغل الفيديو لمشاهدة الفيديو بحجم الشاشة.</div>
</main>
</body>
</html>
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مشاهدة الفيديو</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .video-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      aspect-ratio: 9 / 16;
      background: #000;
      overflow: hidden;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    @media (min-width: 600px) {
      .video-container {
        margin-top: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="video-container">
    <iframe
      src="https://drive.google.com/file/d/1TjqWQSWNoi9j3MZRS0mYR2B2E-utIsWt/preview"
      allow="autoplay; fullscreen"
      allowfullscreen>
    </iframe>
  </div>

</body>
  </html>
